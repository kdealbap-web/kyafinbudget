<div class="min-h-screen bg-gray-50 dark:bg-gray-950 flex flex-col">

  <!-- Header con botón volver -->
  <div class="w-full max-w-lg mx-auto px-4 pt-6">
    <button
      type="button"
      (click)="goBack()"
      class="inline-flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 transition-colors"
    >
      <span aria-hidden="true">←</span>
      Volver a transacciones
    </button>

    <h1 class="mt-8 text-2xl font-bold text-gray-900 dark:text-gray-100 text-center">
      ¿Qué deseas registrar?
    </h1>
    <p class="mt-2 text-gray-500 dark:text-gray-400 text-center">
      Selecciona el tipo de movimiento
    </p>
  </div>

  <!-- Contenido centrado -->
  <div class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-lg grid grid-cols-1 sm:grid-cols-2 gap-4">

      <!-- INGRESO -->
      <button
        type="button"
        (click)="goTo('income')"
        class="group f360-card p-8 flex flex-col items-center gap-4 border-2 border-transparent hover:border-emerald-500 dark:hover:border-emerald-400 hover:shadow-lg hover:-translate-y-1 transition-all duration-200 text-center"
      >
        <div class="w-20 h-20 rounded-2xl bg-white dark:bg-gray-900 border border-emerald-200 dark:border-emerald-800 group-hover:border-emerald-400 dark:group-hover:border-emerald-600 flex items-center justify-center transition-colors">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 text-emerald-700 dark:text-emerald-400" aria-hidden="true">
            <path d="M12 19V5" />
            <path d="M5 12l7-7 7 7" />
          </svg>
        </div>
        <div>
          <h2 class="text-xl font-bold text-emerald-700 dark:text-emerald-400 mb-1">Ingreso</h2>
          <p class="text-sm text-gray-500 dark:text-gray-400">Registra dinero que entra</p>
        </div>
      </button>

      <!-- GASTO -->
      <button
        type="button"
        (click)="goTo('expense')"
        class="group f360-card p-8 flex flex-col items-center gap-4 border-2 border-transparent hover:border-red-500 dark:hover:border-red-400 hover:shadow-lg hover:-translate-y-1 transition-all duration-200 text-center"
      >
        <div class="w-20 h-20 rounded-2xl bg-white dark:bg-gray-900 border border-red-200 dark:border-red-800 group-hover:border-red-400 dark:group-hover:border-red-600 flex items-center justify-center transition-colors">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 text-red-700 dark:text-red-400" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M19 12l-7 7-7-7" />
          </svg>
        </div>
        <div>
          <h2 class="text-xl font-bold text-red-700 dark:text-red-400 mb-1">Gasto</h2>
          <p class="text-sm text-gray-500 dark:text-gray-400">Registra dinero que sale</p>
        </div>
      </button>

    </div>
  </div>

</div>
