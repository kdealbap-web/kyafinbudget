<header class="sticky top-0 z-30 h-16 flex items-center justify-between px-4 lg:px-6
              bg-white/95 dark:bg-gray-950/95 backdrop-blur-md
              border-b border-gray-100 dark:border-gray-800/60">

  <!-- ── IZQUIERDA: Hamburger + Breadcrumb ───── -->
  <div class="flex items-center gap-3">

    <!-- Hamburger (mobile) — conectado al sidebar via Output/service -->
    <button
      class="lg:hidden w-9 h-9 flex items-center justify-center rounded-xl
             text-gray-500 hover:text-gray-900 hover:bg-gray-100
             dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-gray-800/80
             transition-all duration-150"
      aria-label="Abrir menú"
      (click)="onMenuToggle()"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <!-- Home (mobile) -->
    <a
      routerLink="/dashboard"
      class="lg:hidden w-9 h-9 flex items-center justify-center rounded-xl
             text-gray-500 hover:text-gray-900 hover:bg-gray-100
             dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-gray-800/80
             transition-all duration-150"
      aria-label="Ir al dashboard"
      title="Inicio"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>

    <!-- Breadcrumb (desktop) -->
    <nav class="hidden lg:flex items-center gap-2" aria-label="Breadcrumb">
      <a routerLink="/dashboard"
         class="flex items-center text-gray-400 hover:text-gray-600 dark:text-gray-600 dark:hover:text-gray-400 transition-colors"
         aria-label="Dashboard">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>
      <svg class="w-3.5 h-3.5 text-gray-300 dark:text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>
      <span class="text-sm font-semibold text-gray-800 dark:text-gray-200">
        {{ currentPathName() }}
      </span>
    </nav>

  </div>
  <!-- ── DERECHA: Acciones ────────────────────── -->
  <div class="flex items-center gap-1">

    <!-- Toggle dark mode -->
    <button
      type="button"
      (click)="toggleTheme()"
      class="w-9 h-9 flex items-center justify-center rounded-xl
             text-gray-500 hover:text-gray-900 hover:bg-gray-100
             dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-gray-800/80
             transition-all duration-150"
      [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    >
      @if (isDark()) {
        <!-- Sol -->
        <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      } @else {
        <!-- Luna -->
        <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    
    <div class="w-px h-5 bg-gray-200 dark:bg-gray-800 mx-1"></div>

    <!-- Avatar / Dropdown -->
    <div class="relative user-menu-container">
      <button
        type="button"
        (click)="toggleUserMenu()"
        class="flex items-center gap-2.5 pl-1 pr-2 py-1 rounded-xl
               hover:bg-gray-100 dark:hover:bg-gray-800/80
               transition-all duration-150 focus:outline-none"
        [attr.aria-expanded]="showUserMenu()"
        aria-label="Menú de usuario"
      >
        <!-- Avatar -->
        <div class="relative">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white font-bold text-sm shadow-sm">
            {{ userInitial() }}
          </div>
          <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-white dark:border-gray-950"></span>
        </div>
        <!-- Nombre (desktop) -->
        <span class="hidden sm:block text-sm font-semibold text-gray-800 dark:text-gray-200 max-w-[140px] truncate">
          {{ userProfile()?.full_name?.split(' ')?.[0] ?? '' }}
        </span>
        <!-- Chevron -->
        <svg
          class="hidden sm:block w-3.5 h-3.5 text-gray-400 transition-transform duration-200"
          [class.rotate-180]="showUserMenu()"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        >
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <!-- Dropdown -->
      @if (showUserMenu()) {
        <div class="absolute right-0 top-[calc(100%+6px)] w-56 origin-top-right
                    bg-white dark:bg-gray-900
                    border border-gray-100 dark:border-gray-800
                    rounded-xl shadow-xl shadow-black/10 dark:shadow-black/30
                    animate-slide-down z-50 overflow-hidden"
             role="menu">

          <!-- Header usuario -->
          <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/60">
            <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">
              {{ userProfile()?.full_name ?? 'Usuario' }}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400 truncate mt-0.5">
              {{ userProfile()?.email ?? '' }}
            </p>
          </div>

          <!-- Links -->
          <div class="py-1.5">
            <a routerLink="/profile" (click)="showUserMenu.set(false)"
               class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300
                      hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-blue-700 dark:hover:text-blue-300
                      transition-colors"
               role="menuitem">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              Ver perfil
            </a>
            <a routerLink="/settings" (click)="showUserMenu.set(false)"
               class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300
                      hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-blue-700 dark:hover:text-blue-300
                      transition-colors"
               role="menuitem">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              Configuración
            </a>
          </div>

          <!-- Logout -->
          <div class="border-t border-gray-100 dark:border-gray-800 py-1.5">
            <button
              type="button"
              (click)="logout()"
              class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-left text-red-600 dark:text-red-400
                     hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors"
              role="menuitem"
            >
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Cerrar sesión
            </button>
          </div>

        </div>
      }
    </div>

  </div>
</header>
