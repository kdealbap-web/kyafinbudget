<div class="fixed top-4 right-4 z-[9998] flex flex-col gap-3 pointer-events-none" aria-live="polite">
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center gap-3 min-w-[280px] max-w-sm px-4 py-3.5 rounded-xl shadow-xl animate-slide-up {{ classFor(toast.type) }}"
      role="alert"
    >
      <!-- Icono -->
      <span class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold {{ iconBgFor(toast.type) }}">
        {{ iconFor(toast.type) }}
      </span>

      <!-- Mensaje -->
      <span class="flex-1 text-sm font-medium leading-snug">{{ toast.message }}</span>

      <!-- Botón cerrar -->
      <button
        type="button"
        class="flex-shrink-0 opacity-70 hover:opacity-100 transition-opacity ml-1"
        (click)="dismiss(toast.id)"
        aria-label="Cerrar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
